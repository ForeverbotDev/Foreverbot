<svg xmlns="http://www.w3.org/2000/svg" viewBox="2000 100 5600 4600" width="32" height="28">
  <defs>
    <!-- Minor 3D Shadow -->
    <filter id="minorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="120" stdDeviation="90" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="40" stdDeviation="40" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- 3D White Bevel / Gradient Stroke -->
    <linearGradient id="white3dStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0" />
      <stop offset="50%" stop-color="#f1f5f9" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="subtleInnerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>
  </defs>

  <!-- Deep 3D Under-layer (Simulating extruded 3D thickness) -->
