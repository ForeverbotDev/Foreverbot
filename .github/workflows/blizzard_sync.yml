name: 🔄 Blizzard Live Tracker Blue Sync

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync Blizzard Patch Notes & Blue Tracker
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔄 Sync Live Tracker Blue Notes
        run: |
          python scripts/sync_blizzard_blue_tracker.py

      - name: 🚀 Commit & Push Updates If Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/BLIZZARD_BETA_PATCH_NOTES.md)" ]; then
            git add docs/BLIZZARD_BETA_PATCH_NOTES.md
            git commit -m "chore(sync): update Blizzard Live Tracker Blue notes [skip ci]"
            git push origin main
          else
            echo "No new Blizzard Blue Tracker notes detected."
          fi
