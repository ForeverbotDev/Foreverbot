name: 🛡️ Tuesday Night WoW Forever Intel & Database Sync

on:
  schedule:
    # Runs every Tuesday night at 03:00 UTC Wednesday (11:00 PM Tuesday EDT / 8:00 PM Tuesday PDT)
    - cron: "0 3 * * 3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tuesday_sync:
    name: Sync Tuesday Patch Notes, Blue Comments, Stealth Hotfixes & Update Database
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🗄️ Run Tuesday Night Intel & Database Sync
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_ANNOUNCEMENTS_WEBHOOK: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK }}
        run: |
          python scripts/tuesday_weekly_intel_sync.py

      - name: 🧪 Run Integrity & Sub-Second Latency Verification
        run: |
          python tests/test_subsecond_knowledge_benchmark.py

      - name: 🚀 Commit & Push Updates If Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/TUESDAY_WEEKLY_INTEL.md wow_forever.db docs/BLIZZARD_BETA_PATCH_NOTES.md
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore(sync): Tuesday weekly database & intel update [skip ci]"
            git push origin main
          else
            echo "No database or intel changes detected this cycle."
          fi
